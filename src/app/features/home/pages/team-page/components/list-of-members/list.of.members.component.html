<section class="flex flex-col gap-4 text-white w-full">
  @for (member of getRoster(); track $index) {
  <div class="rounded-2xl border border-white/10 bg-white/10 px-2 py-2 shadow-lg ring-1 ring-white/10 backdrop-blur transition-all duration-200 hover:-translate-y-1 hover:border-primary-300/40 hover:bg-white/20">
    <div class="px-4 py-2 flex items-start justify-between gap-2">
      <div class="flex flex items-center">
        <img [src]="member.avatar" alt="{{ member.name }}" class="h-16 w-16 rounded-full object-cover" />
        <div class="flex flex-col">
          <span>{{ member.name }}</span>
          <span class="text-slate-500">{{ member.email }}</span>
        </div>
      </div>
      <button class="my-button px-3 py-2">Contctar</button>
    </div>
    <div class="flex flex-wrap gap-2 ">
      @for (item of getNamesProjects(member.id); track $index) { 
        <span class="rounded-full bg-white/10 px-2 ring-1 text-sm ring-white/10">{{item}}</span>
      }
    </div>
  </div>
  }
</section>
